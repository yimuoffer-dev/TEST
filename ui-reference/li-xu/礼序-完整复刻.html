const icon=k=>`<svg class="icon" viewBox="0 0 30 30" aria-hidden="true"><path d="${paths[k]||paths.book}"/></svg>`;const badge=(type='plum',isIcon=false)=>`<div class="badge">${isIcon?icon(type):art(type)}</div>`;const chevron='<span class="chevron">›</span>';let tab='全部',year=2026,amount='800',direction='收礼',relation='亲友';
const books=[{name:'婚礼',art:'plum',cls:'',sub:'家门有喜 · 良缘永结',date:'十月十八日',count:128},{name:'满月',art:'bamboo',cls:'bamboo',sub:'添丁之喜 · 福满新生',date:'八月初九',count:62},{name:'乔迁',art:'bamboo',cls:'crane',sub:'安居乐业 · 乔迁之喜',date:'六月初八',count:56},{name:'寿宴',art:'flower',cls:'flower',sub:'福寿安康 · 敬贺华诞',date:'三月十二日',count:89}];

function cover(b){return `<div class="cover ${b.cls}">${art(b.art,'art')}<div class="binding"><i></i><i></i><i></i></div><div class="label">${b.name}礼簿<small>${b.name==='婚礼'?'囍':b.name==='寿宴'?'寿':'礼'}</small></div></div>`}

function recent(){return `<div class="rows frame">${contacts.slice(0,2).map((c,i)=>`<button class="row" data-go="person">${badge(c[6])}<div><div class="name">${c[0]} · ${c[2]}</div>${tag(i?'送礼':'收礼',!i)}</div><span class="amount"><small>¥</small>${c[5]}</span></button>`).join('')}</div>`}
function home(){return `${hero('礼序','往来有礼，岁月留情')}${search('查找亲友、礼簿、往来记录')}${section('我的礼簿','books')}<div class="books">${[books[0],{...books[2],cls:'bamboo'}].map(b=>`<button class="book-card" data-go="book">${cover(b)}<div class="book-note"><p>${b.sub}</p><p>— ${b.date} —</p><p>${icon('record')} 收礼记录 <b>${b.count}</b> 笔</p></div></button>`).join('')}</div><button class="new-book frame ornate" data-do="new">${icon('plus')}<div>新开一册礼簿<small>为重要的日子留下记录</small></div>${art('cloud','decor cloud')}</button>${section('近日往来','people')}${recent()}`}
function people(){return `${hero('人情往来')}${search('搜索姓名、关系、事件')}${stats([['收礼','268'],['送礼','193'],['往来人数','412']])}${tabs(['全部','最近往来','待回礼','重要亲友'])}<div id="contact-list">${contactRows(contacts)}</div>${land()}`}
function contactRows(list){return list.map(c=>`<button class="row contact frame" data-go="person">${badge(c[6])}<div><div class="name">${c[0]}</div>${tag(c[1])}</div><div class="middle">${c[2]}<small>${c[3]}<br>近三年往来 <em>${c[4]}</em> 次</small></div><div class="amount"><small>¥</small>${c[5]}</div>${chevron}</button>`).join('')||'<div class="empty">暂无匹配的往来记录</div>'}
function bookList(){return `${search('搜索礼簿名称、事件、年份')}<div class="filters"><select id="type-filter" aria-label="礼簿类型"><option>全部类型</option>${books.map(b=>`<option>${b.name}</option>`).join('')}</select><select aria-label="年份"><option>按年份</option><option>2026</option></select></div>${section('二〇二六')}<div class="book-list" id="book-list">${bookRows(books)}</div>${action('新建礼簿','new')}${land()}`}

function summary(compact=false){return `<div class="summary frame ornate ${compact?'compact':''}">${cover(books[0])}<div class="book-info">${art('plum','decor branch')}${art('landscape','decor mountain')}<h2>婚礼礼簿</h2>${compact?'':'<p>— 家门有喜 · 良缘永结 —</p>'}<p>二〇二六年十月十八日</p>${compact?'':`<p>主家：张府</p><div class="total">收礼 <b>128</b> 笔　│　合计 <b>¥86,800</b></div>`}</div></div>`}
function book(){let rows=[['李阿姨','亲友','plum','1,200','已登记','09:26'],['王叔叔','亲友','bamboo','800','入簿完成','09:41'],['陈老师','师长','flower','600','已登记','10:03'],['赵同学','同学','flower','500','入簿完成','10:17'],['刘伯伯','邻里','ginkgo','1,000','已登记','11:08']];let saved=JSON.parse(localStorage.getItem('lixu-records')||'[]');rows=[...saved.map(x=>[x.name,x.relation,'plum',Number(x.amount).toLocaleString(),'已登记','刚刚']),...rows];return `${summary()}${tabs(['全部','收礼','礼品','备注'])}${section('礼簿明细')}<div class="rows frame entry-rows">${(tab==='礼品'||tab==='备注'?[]:rows).map(c=>`<button class="row" data-go="person">${badge(c[2])}<div class="name">${c[0]}${tag(c[1])}</div><div class="desc">${c[4]}<br><small>10月18日 ${c[5]}</small></div><span class="amount"><small>¥</small>${c[3]}</span>${chevron}</button>`).join('')||'<div class="empty">本礼簿暂无此类记录</div>'}</div>${action('记一笔','entry')}${land()}`}
function person(){const events=[['婚礼','收礼','二〇二六年十月十八日','800','plum'],['乔迁','送礼','二〇二五年六月初八','600','bamboo'],['满月','送礼','二〇二四年八月初九','400','flower'],['订婚','收礼','二〇二三年五月初六','1,800','ginkgo']];return `<div class="person-summary summary frame ornate">${badge('plum')}<div class="profile-text"><h2>张先生</h2>${tag('亲友',true)}<p class="motto">— 往来有度，情谊常在 —</p></div>${art('landscape','decor mountain')}</div><div style="margin-top:20px">${stats([['累计收礼','<small>¥</small>2,600'],['累计送礼','<small>¥</small>1,800'],['往来','4 <small style="color:var(--ink)">次</small>']])}</div>${tabs(['全部','收礼','送礼'])}${section('往来记录')}<div class="timeline">${events.filter(e=>tab==='全部'||e[1]===tab).map(e=>`<div class="row frame">${badge(e[4])}<div><div class="name">${e[0]}</div>${tag(e[1],e[1]==='收礼')}</div><div class="date">${e[2]}</div><span class="amount"><small>¥</small>${e[3]}</span></div>`).join('')}</div>${section('往来备注')}<div class="note frame ornate">与张家多年往来，逢婚喜寿庆均有互赠。</div>${action('新增往来','entry')}${land()}`}
function profile(){const service=(arr)=>`<div class="rows frame service">${arr.map(([i,s,d])=>`<button class="row" ${d?`data-go="${d}"`:`data-do="${s}"`}>${badge(i,true)}<span>${s}</span>${chevron}</button>`).join('')}</div>`;return `<div class="profile-card frame ornate"><div class="profile-top">${badge('bamboo')}<div class="profile-text"><h2>张 明</h2><p class="motto">— 家之礼，有簿可循 —</p><button class="member" data-do="典藏用户">♛ 礼序典藏用户</button></div>${art('landscape','decor mountain')}</div>${stats([[`${icon('book')}礼簿`,'12'],[`${icon('people')}亲友`,'412'],[`${icon('record')}记录`,'689']])}</div>${section('我的礼簿服务')}${service([['plus','新建礼簿','new'],['download','导出礼簿'],['home','家庭共享'],['database','数据备份']])}${section('管理与工具')}${service([['people','亲友管理','people'],['bell','提醒设置'],['shield','隐私保护'],['help','帮助与反馈']])}`}
function statistics(){let v=[.38,.5,1.1,.7,1.05,2.1,.65,.85,1.6,2.7,1.22,1.22];return `<div class="year"><button data-year="-1" aria-label="上一年">‹</button><span id="year">${year===2026?'二〇二六':year}年度 ▾</span><button data-year="1" aria-label="下一年">›</button></div><div class="metrics">${[['gift','收礼总额','<small>¥</small>128,600'],['download','送礼总额','<small>¥</small>96,300'],['people','往来人数','412']].map(c=>`<div class="metric frame ornate">${badge(c[0],true)}${c[1]}<b>${c[2]}</b>${art('cloud','cloud')}</div>`).join('')}</div>${section('年度收送趋势')}<div class="chart frame ornate"><div class="chart-head">金额（万元）<span><i class="key"></i>收礼　<i class="key pale"></i>送礼</span></div><div class="bars"><div class="axis">${['3.0','2.5','2.0','1.5','1.0','0.5','0'].map(n=>`<span>${n}</span>`).join('')}</div>${v.map((n,i)=>`<div class="bar-group"><i style="height:${n/3*100}%" title="${i+1}月收礼 ${n}万元"></i><i style="height:${n/3*76}%" title="${i+1}月送礼 ${(n*.76).toFixed(2)}万元"></i><label>${i+1}月</label></div>`).join('')}</div></div>${section('礼簿分类占比')}<div class="category frame ornate"><div class="donut"><div class="donut-center">${art('plum')}总额<b>¥224,900</b></div></div><div class="category-list">${[['plum','婚礼','94,458',42],['bamboo','满月','53,976',24],['home','乔迁','44,980',20],['flower','寿宴','31,486',14]].map(c=>`<div class="row">${badge(c[0],c[0]==='home')}<div><div class="name">${c[1]}</div><div class="desc">¥${c[2]}</div></div><span class="amount">${c[3]}%</span></div>`).join('')}</div></div>${section('往来频次前五')}<div class="ranking rows frame ornate">${contacts.map(c=>`<button class="row" data-go="person">${badge(c[6])}<span class="name">${c[0]}</span><span class="amount">${c[4]}次</span>${chevron}</button>`).join('')}</div>`}
function entry(){return `${summary(true)}${tabs(['收礼','送礼']).replaceAll('data-tab','data-direction').replace('class=""','class="selected"')}<div class="field frame">${badge('plum')}<label for="name">姓名</label><input id="name" placeholder="请输入姓名" autocomplete="name"></div><div class="field frame">${badge('bamboo')}<label>关系</label><div class="relations">${['亲友','同学','同事','邻里'].map(r=>`<button data-relation="${r}" class="${r===relation?'selected':''}">${r}</button>`).join('')}</div></div><div class="field money frame ornate">${badge('flower')}<label for="money">礼金</label><div class="currency">¥</div><input id="money" inputmode="decimal" aria-label="礼金" value="${amount}">${art('cloud','decor cloud')}</div><div class="field frame">${badge('ginkgo')}<label for="gift">礼品</label><input id="gift" placeholder="可选填写">${chevron}</div><div class="field frame">${badge('flower')}<label for="note">备注</label><input id="note" placeholder="写下简短说明"></div><div class="keypad">${['1','2','3','⌫','4','5','6','清空','7','8','9','.','0'].map(n=>`<button data-key="${n}" class="${n==='0'?'zero':''}">${n}</button>`).join('')}</div><div class="save-actions"><button data-save="exit">保存</button><button class="action" data-save="continue">保存并继续</button></div>`}

function resize(){$('#app').style.zoom=Math.min(innerWidth/863,1)}addEventListener('resize',resize);addEventListener('hashchange',()=>{tab='全部';render();scrollTo(0,0)});
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2500)}
function modal(title,body){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal').showModal()}
function newBook(){modal('新开一册礼簿','<input id="new-name" required placeholder="礼簿名称"><select id="new-type"><option>婚礼</option><option>满月</option><option>乔迁</option><option>寿宴</option></select><input type="date" aria-label="日期" required><button class="action" id="create-book" type="button">创建礼簿</button>')}
function bindSearch(){let r=route();if($('#search'))$('#search').oninput=e=>{let q=e.target.value.trim();if(r==='people')$('#contact-list').innerHTML=contactRows(contacts.filter(c=>c.join('').includes(q)));else if(r==='books')$('#book-list').innerHTML=bookRows(books.filter(b=>(b.name+b.sub+'2026').includes(q)));else {if(q)toast('按回车查看搜索结果')}};if(r==='home')$('#search').onkeydown=e=>{if(e.key==='Enter'){location.hash='people';setTimeout(()=>{$('#search').value=e.target.value;$('#search').dispatchEvent(new Event('input'))},0)}};if($('#type-filter'))$('#type-filter').onchange=e=>$('#book-list').innerHTML=bookRows(books.filter(b=>e.target.value==='全部类型'||b.name===e.target.value));if($('#money'))$('#money').oninput=e=>amount=e.target.value}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-back')){location.hash=route()==='entry'?'book':route()==='person'?'people':'home'}if(b.dataset.go){if(b.dataset.go==='new')newBook();else location.hash=b.dataset.go}if(b.dataset.tab){tab=b.dataset.tab;render();if(route()==='people'){const list=tab==='全部'?contacts:tab==='最近往来'?contacts.slice(0,3):tab==='待回礼'?contacts.filter((_,i)=>i%2===0):contacts.slice(0,2);$('#contact-list').innerHTML=contactRows(list)}}if(b.dataset.direction){direction=b.dataset.direction;document.querySelectorAll('[data-direction]').forEach(x=>x.classList.toggle('selected',x===b))}if(b.dataset.relation){relation=b.dataset.relation;document.querySelectorAll('[data-relation]').forEach(x=>x.classList.toggle('selected',x===b))}if(b.dataset.key){let k=b.dataset.key;amount=k==='清空'?'':k==='⌫'?amount.slice(0,-1):k==='.'&&amount.includes('.')?amount:(amount==='0'?'':amount)+k;$('#money').value=amount}if(b.dataset.save){let name=$('#name').value.trim();if(!name){toast('请填写姓名');$('#name').focus();return}if(!Number(amount)||Number(amount)<0){toast('请输入有效礼金');return}const records=JSON.parse(localStorage.getItem('lixu-records')||'[]');records.unshift({name,amount,relation,direction,gift:$('#gift').value,note:$('#note').value});localStorage.setItem('lixu-records',JSON.stringify(records));toast('已保存入簿');if(b.dataset.save==='exit')location.hash='book';else{$('#name').value='';$('#gift').value='';$('#note').value='';$('#name').focus()}}if(b.dataset.year){year+=Number(b.dataset.year);$('#year').textContent=year+'年度 ▾';toast('当前展示为界面示例统计数据')}if(b.dataset.do){let d=b.dataset.do;if(d==='new')newBook();else if(d==='导出礼簿'||d==='数据备份'){let blob=new Blob([JSON.stringify(JSON.parse(localStorage.getItem('lixu-records')||'[]'),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='礼序-往来记录.json';a.click();URL.revokeObjectURL(a.href);toast('已导出本地记录')}else modal(d,`<p>${d==='隐私保护'?'此 HTML 演示的新增记录仅保存在当前浏览器中。':d==='家庭共享'?'家庭共享需要连接账户服务。当前为本地交互演示。':d==='提醒设置'?'<label><input type="checkbox" checked> 重要日期提醒</label>':'礼序 · 往来有礼，岁月留情。本页面为参考样式交互演示。'}</p>`)}if(b.id==='create-book'){if(!$('#new-name').value.trim()){toast('请输入礼簿名称');return}books.push({name:$('#new-name').value.trim(),art:'plum',cls:'',sub:'为重要的日子留下记录',date:'今日',count:0});$('#modal').close();location.hash='books';if(route()==='books')render();toast('礼簿已创建')}});render();
</script></body></html>
