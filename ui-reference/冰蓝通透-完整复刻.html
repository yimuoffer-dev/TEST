$('#detail-page').innerHTML=status+`<div class="content"><div class="topline"><button aria-label="返回首页" onclick="showPage(0)">${icon('back')}</button><div><button class="detail-star" aria-label="收藏" onclick="save(this)">${icon('star')}</button>　<button aria-label="更多" onclick="modal('招聘信息','招聘信息仅作页面交互演示，投递前请核对企业官方公告。')">···</button></div></div><div class="company">${logo(1)}<div><h4 id="detail-name">星辰科技2027届校园招聘 <span class="tag">民企</span></h4><p>互联网 ｜ 1000-5000人 ｜ 上海</p></div></div><div class="card"><h4 class="section-title">招聘信息</h4><div class="info-grid">${[['calendar','开始时间','2026-10-01'],['calendar','截止时间','2026-11-20'],['pin','工作地点','上海 · 北京']].map(([i,t,v])=>`<div class="info">${icon(i)}${t}<b>${v}</b></div>`).join('')}</div></div><div class="card"><h4 class="section-title">招聘岗位 <small>（3个）</small><small><button onclick="modal('招聘岗位','产品经理：10-15人；软件开发：20-30人；数据分析：5-10人。')">查看全部 ${icon('chevron')}</button></small></h4><div class="info-grid">${[['产品经理','10-15人'],['软件开发','20-30人'],['数据分析','5-10人']].map(([t,v])=>`<button class="position" onclick="modal('${t}','面向2027届毕业生，本科及以上学历。工作地点：上海、北京。')">${t}<small>${v}</small></button>`).join('')}</div></div><div class="card"><h4 class="section-title">招聘专业 <small>（3个）</small><small>查看全部 ${icon('chevron')}</small></h4><div class="info-grid">${['计算机类','软件工程','统计学'].map(t=>`<div class="info" style="font-size:11px">${t}</div>`).join('')}</div></div><div class="card"><h4 class="section-title">企业介绍</h4><p class="description">星辰科技是一家专注于人工智能与大数据技术的创新型科技公司，致力于用技术驱动产业升级。公司总部位于上海，在北京、深圳等地设有研发中心<span id="extra-desc" class="hidden">，为年轻人才提供完善的成长体系与广阔的发展空间。欢迎2027届毕业生加入，与我们一起创造未来。</span>…</p><button class="more" onclick="$('#extra-desc').classList.toggle('hidden');this.textContent=this.textContent==='收起'?'展开更多⌄':'收起'">展开更多⌄</button></div></div><button class="blue float-sub" onclick="toast('已添加到求职追踪')">＋ 添加追踪</button><nav class="nav detail-footer"><button onclick="save(this)">${icon('star')}收藏</button><button onclick="share()">${icon('share')}分享</button><button onclick="modal('招聘原文','这是参考样式复刻页面，原文链接需接入真实招聘数据。')">${icon('file')}原文</button><button class="blue" onclick="modal('立即投递','请准备个人简历。此页面为交互演示，暂未连接企业投递系统。')">立即投递</button></nav>`;
$('#daily-page').innerHTML=status+`<div class="content"><div class="topline"><h2>求职日报</h2><button style="color:#186dff;font-size:10px" onclick="selectDay(14)">${icon('calendar')} 回到本周</button></div><div class="calendar"><div class="month">10月</div><div class="days">${[12,13,14,15,16,17,18].map((d,i)=>`<button data-day="${d}" class="day ${d===14?'active':''}" onclick="selectDay(${d})">${d}<small>${['周日','周一','周二','周三','周四','周五','周六'][i]}</small></button>`).join('')}</div></div><div class="daily-stats"><div class="daily-stat">今日新增<b>36</b>${icon('file')}</div><div class="daily-stat">今日截止<b class="red">8</b>${icon('clock')}</div></div><h4 class="section-title" id="daily-title">10月14日新增公告</h4>${jobs.map(job).join('')}</div>`+nav(1);
const recordData=[['星辰科技','产品经理','一面','2026-10-14',1,''],['海川集团','管培生','笔试','2026-10-12',2,'bluebadge'],['云帆科技','软件工程师','Offer','2026-10-10',3,'greenbadge']];
function records(filter='全部状态'){return recordData.filter(r=>filter==='全部状态'||r[2]===filter).map(([n,p,s,d,b,c])=>`<button class="card record" style="width:100%;text-align:left" onclick="modal('${n} · ${p}','当前状态：${s}。投递时间：${d}。')">${logo(b)}<div><h4>${n}<span>${p}</span><em class="badge ${c}" style="font-style:normal">${s}</em></h4><p>投递时间 ${d}</p></div>${icon('chevron')}</button>`).join('')||'<div class="card description">暂无该状态的投递记录</div>'}
$('#records-page').innerHTML=status+`<div class="content"><div class="topline"><h2>投递记录</h2><select aria-label="投递状态" onchange="$('#record-list').innerHTML=records(this.value)">${['全部状态','一面','笔试','Offer'].map(t=>`<option>${t}</option>`).join('')}</select></div><div class="record-stats"><div class="stat">记录总数<b>12</b></div><div class="stat">进行中<b>8</b></div></div><div class="mini-states">${[['file','已投递','4','#237aff'],['bag','笔试','2','#9662ff'],['user','面试','2','#ff8c41'],['check','Offer','2','#29cda9'],['plus','已拒绝','1','#ff4c69'],['calendar','已签约','1','#26cfad']].map(([i,t,v,c])=>`<div class="mini-state" style="--c:${c}">${icon(i)}${t}<b>${v}</b></div>`).join('')}</div><div id="record-list">${records()}</div></div><button class="blue add" aria-label="添加投递记录" onclick="modal('新增投递记录','可在招聘详情页点击「添加追踪」，将企业加入求职记录。')">＋</button>`+nav(2);
const menus=[['user','个人资料','link','账号绑定'],['star','我的收藏','file','我的订单'],['shield','校招记录','gift','会员兑换'],['user','分销中心','help','帮助中心']];
function menu(rows){return `<div class="menu">${rows.map(r=>`<div class="menu-row">${[r.slice(0,2),r.slice(2,4)].map(([i,t])=>`<button onclick="menuAction('${t}')">${icon(i)}${t}${icon('chevron','chevron')}</button>`).join('')}</div>`).join('')}</div>`}
$('#profile-page').innerHTML=status+`<div class="content"><button class="profile" style="width:100%;text-align:left" onclick="menuAction('个人资料')">${avatar}<div><h2>小林</h2><p>2027届 · 计算机专业</p></div>${icon('chevron')}</button><div class="membership">${icon('crown')}<div><b>一年会员</b><small>有效期至 2027.10.14</small></div><button onclick="modal('会员兑换','请输入真实兑换码后，可在正式系统中兑换会员权益。')">续费</button></div><div class="profile-stats">${[['投递记录','12'],['我的收藏','24'],['Offer','2']].map(([t,v])=>`<div>${t}<b>${v}</b></div>`).join('')}</div>${menu(menus)}</div>`+nav(3);
const money=rows=>`<div class="money-grid">${rows.map(([t,v])=>`<div>${t}<b>${v}</b></div>`).join('')}</div>`;
$('#distribution-page').innerHTML=status+`<div class="content"><div class="topline"><button onclick="showPage(4)" aria-label="返回个人中心">${icon('back')}</button><h2>分销中心</h2></div><div class="profile">${avatar}<div><h2>小林 <span class="goldtag"><svg class="icon" style="width:12px;height:12px"><use href="#crown"/></svg> 分销员</span></h2><p>推荐人：学长</p></div></div><div class="glass-art">${icon('bag')}</div><div class="wallet"><div class="balance">可提现金额<b><small>¥</small>268.00</b><button class="blue" onclick="modal('申请提现','可提现金额：¥268.00。最低提现50元，审核后打款。此页面暂未连接真实账户。')">提现</button></div>${money([['已提现','¥100.00'],['处理中 ⓘ','¥50.00'],['累计佣金','¥418.00']])}</div><div class="metrics">${money([['今日佣金','¥28.00'],['本月佣金','¥168.00'],['累计订单','16']])}${money([['推荐人数','32'],['付费客户','8'],['转化率','25%']])}</div>${menu([['clock','资金明细','file','订单明细'],['user','客户明细','link','推广工具']])}<p class="footnote">${icon('info')}最低提现50元，审核后打款。</p></div>`;
function showPage(n){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('selected',+p.dataset.page===n));document.querySelectorAll('.mobile-switch button').forEach((b,i)=>b.classList.toggle('active',i===n));if(innerWidth>760){let p=document.querySelector(`[data-page="${n}"]`);p.animate([{filter:'brightness(1.1)'},{filter:'brightness(1)'}],{duration:500});p.scrollIntoView({behavior:'smooth',block:'nearest'})}}
$('#switch').innerHTML=['首页','招聘详情','求职日报','投递记录','个人中心','分销中心'].map((t,i)=>`<button class="${i===0?'active':''}" onclick="showPage(${i})">${t}</button>`).join('');
function toast(t){$('.toast').textContent=t;$('.toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('.toast').classList.remove('show'),2200)}function modal(t,s){$('#modal-title').textContent=t;$('#modal-text').textContent=s;$('.modal').showModal()}function save(b){b.classList.toggle('saved');b.setAttribute('aria-pressed',b.classList.contains('saved'));toast(b.classList.contains('saved')?'已加入收藏':'已取消收藏')}function openJob(t){$('#detail-name').textContent=t;showPage(1)}function selectDay(d){document.querySelectorAll('.day').forEach(b=>b.classList.toggle('active',+b.dataset.day===d));$('#daily-title').textContent=`10月${d}日新增公告`}let selectedCategory='全部';function category(b,t){selectedCategory=t;document.querySelectorAll('.category').forEach(c=>c.classList.remove('active'));b.classList.add('active');filterJobs()}function filterJobs(){let q=$('#search-input').value.trim();const matched=jobs.filter(j=>(selectedCategory==='全部'||j.cat===selectedCategory)&&(j.name.includes(q)||'上海北京产品经理软件开发数据分析'.includes(q)));$('#job-list').innerHTML=matched.map(job).join('')||'<div class="card description">暂无匹配的招聘信息，请尝试其他关键词。</div>'}function tab(b){b.parentNode.querySelectorAll('button').forEach(c=>c.classList.remove('active'));b.classList.add('active');$('#job-list').innerHTML=(b.textContent==='推荐'? [...jobs].reverse():jobs).map(job).join('')}function menuAction(t){if(t==='分销中心')return showPage(5);if(t==='校招记录')return showPage(3);modal(t,{'个人资料':'小林 · 2027届毕业生 · 计算机专业','我的收藏':'已收藏24条招聘信息。点击招聘卡片右侧的星标，可收藏或取消收藏。','推广工具':'分享你的专属推广链接，邀请同学一起发现校招机会。'}[t]||'此页面为UI与交互演示，正式功能需接入业务数据。')}async function share(){try{await navigator.clipboard.writeText(location.href);toast('页面链接已复制')}catch{modal('分享招聘','请复制浏览器地址栏链接进行分享。')}}
</script></body></html>
