function saveProgress(){const f=$('#progress-form');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));d.company=d.company.trim();d.role=d.role.trim();if(!d.company||!d.role)return toast('请填写单位名称和投递岗位');d.job=+d.job||formSource||null;const existing=editRecordId?records.find(r=>r.id===editRecordId):d.job?records.find(r=>r.job===d.job&&r.role===d.role):null;if(existing){Object.assign(existing,d);existing.history.push({state:d.state,date:d.date,note:d.note})}else records.unshift({...d,id:Date.now(),history:[{state:d.state,date:d.date,note:d.note}]});dirty=false;persist();render(3);render(4);go(3);toast('投递进展已保存')}
function recordDetail(id){const r=records.find(r=>r.id===id);modal(esc(r.company)+' · '+esc(r.role),`<div class="tags"><span>${r.state}</span><span>首次投递 ${r.history[0].date}</span></div><p style="margin-top:10px">${esc(r.note||'暂无备注')}</p>${[['内推码',r.code],['内推链接',r.referral],['投递地址',r.url],['公告原文',r.original]].filter(([_,v])=>v).map(([t,v])=>`<p>${t}：${esc(v)}</p>`).join('')}<div class="timeline">${[...r.history].reverse().map(h=>`<p><b>${h.state}</b><small>${h.date}</small>${esc(h.note)}</p>`).join('')}</div><button class="expand" onclick="closeDialog();${r.job?'openJob('+r.job+')':"toast('此记录未关联公告')"}">查看原招聘公告</button><button class="expand" style="color:#f35365" onclick="deleteRecord(${r.id})">删除记录</button>`,[['关闭',closeDialog],['添加 / 编辑进展',()=>{closeDialog();editRecordId=r.id;formSource=r.job;dirty=false;render(9);go(9)},'primary']])}
function deleteRecord(id){modal('删除投递记录','将同时删除该记录的全部进展历史，确认删除？',[['取消',closeDialog],['删除',()=>{records=records.filter(r=>r.id!==id);persist();render(3);render(4);closeDialog();toast('记录已删除')},'primary']])}
